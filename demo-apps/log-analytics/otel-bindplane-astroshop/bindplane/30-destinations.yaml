apiVersion: bindplane.observiq.com/v1
kind: Destination
metadata:
  name: shop-prometheus
spec:
  type: prometheus_remote_write
  parameters:
  - name: hostname
    value: 127.0.0.1
  - name: port
    value: 9090
  - name: path
    value: /api/v1/write
  - name: enable_tls
    value: false
  - name: enable_resource_to_telemetry_conversion
    value: true
  - name: prw_protocol
    value: prometheus.WriteRequest
  - name: add_unit_and_type
    value: false
  - name: namespace
    value: ''
  - name: headers
    value: {}
  - name: external_labels
    value: {}
  - name: strict_tls_verify
    value: false
  - name: ca_file
    value: ''
  - name: mutual_tls
    value: false
  - name: cert_file
    value: ''
  - name: key_file
    value: ''
  - name: enable_write_ahead_log
    value: true
  - name: wal_storage_path
    value: prometheus_rw
  - name: wal_buffer_size
    value: 300
  - name: wal_truncate_frequency
    value: 60
  - name: retry_on_failure_enabled
    value: true
  - name: retry_on_failure_initial_interval
    value: 5
  - name: retry_on_failure_max_interval
    value: 30
  - name: retry_on_failure_max_elapsed_time
    value: 300
