# Generated from the lab's live Bindplane export. Double-brace placeholders are filled by scripts/render.py from lab.env.
---
apiVersion: bindplane.observiq.com/v1
kind: Destination
metadata:
  name: dynatrace
spec:
  type: dynatrace_otlp
  parameters:
  - name: telemetry_types
    value:
    - Logs
    - Metrics
    - Traces
  - name: deployment_type
    value: Custom
  - name: custom_url
    value: '{{DT_OTLP_URL}}'
  - name: activegate_hostname
    value: ''
  - name: port
    value: 9999
  - name: your_environment_id
    value: {{DT_ENV_ID}}
  - name: dynatrace_api_token
    value: '{{DT_INGEST_TOKEN}}'
    sensitive: true
  - name: insecure_skip_verify
    value: false
  - name: ca_file
    value: ''
  - name: headers
    value: {}
  - name: drop_raw_copy
    value: true
  - name: retry_on_failure_enabled
    value: true
  - name: retry_on_failure_initial_interval
    value: 5
  - name: retry_on_failure_max_interval
    value: 30
  - name: retry_on_failure_max_elapsed_time
    value: 300
  - name: sending_queue_enabled
    value: true
  - name: sending_queue_num_consumers
    value: 10
  - name: sending_queue_queue_size
    value: 5000
  - name: persistent_queue_enabled
    value: true
  - name: persistent_queue_storage_extension
    value:
      disabled: false
      parameters:
      - name: persistent_queue_directory
        value: storage
      - name: persistent_queue_fsync
        value: true
      - name: timeout
        value: 1
      type: file_storage_persistent_queue
---
