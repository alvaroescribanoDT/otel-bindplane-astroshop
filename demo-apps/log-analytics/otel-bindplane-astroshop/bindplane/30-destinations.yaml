---
apiVersion: bindplane.observiq.com/v1
kind: Destination
metadata:
  name: shop-s3-archive
spec:
  type: aws_s3
  parameters:
  - name: telemetry_types
    value:
    - Logs
  - name: region
    value: '{{AWS_REGION}}'
  - name: bucket
    value: {{S3_BUCKET}}
  - name: prefix
    value: shop-logs
  - name: file_prefix
    value: bindplane
  - name: partition
    value: hour
  - name: partition_format
    value: year=%Y/month=%m/day=%d/hour=%H
  - name: compression
    value: gzip
  - name: logs_marshaler
    value: otlp_json
  - name: drop_raw_copy
    value: true
  - name: storage_class
    value: STANDARD
  - name: endpoint
    value: ''
  - name: metrics_marshaler
    value: otlp_json
  - name: traces_marshaler
    value: otlp_json
  - name: resource_to_prefix
    value: com.awss3.prefix
  - name: timeout
    value: 30
  - name: retry_mode
    value: standard
  - name: retry_max_attempts
    value: 3
  - name: retry_max_backoff
    value: 20
  - name: sending_queue_enabled
    value: false
  - name: sending_queue_num_consumers
    value: 10
  - name: sending_queue_queue_size
    value: 5000
  - name: sending_queue_wait_for_result
    value: false
  - name: sending_queue_block_on_overflow
    value: false
  - name: persistent_queue_enabled
    value: true
  - name: persistent_queue_storage_extension
    value:
      parameters:
      - name: persistent_queue_directory
        value: storage
      - name: timeout
        value: 1
      - name: persistent_queue_fsync
        value: true
      type: file_storage_persistent_queue
  - name: access_key
    value: ''
    sensitive: true
  - name: secret_key
    value: ''
    sensitive: true
