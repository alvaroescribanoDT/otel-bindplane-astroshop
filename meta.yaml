title: "OTel Astronomy Shop with Bindplane: PII masking, log reduction and S3 archive into Dynatrace"
description: >
  Deploys the OpenTelemetry Astronomy Shop on one EC2 host with a Bindplane-managed collector that masks PII,
  samples and deduplicates logs, fixes severities, adds host context and archives redacted logs to S3 before
  sending everything to Dynatrace. One settings file and one script (lab.sh) build it in your own AWS account,
  Bindplane project and Dynatrace tenant, including OpenPipeline routes and three demo dashboards.
purpose: >
  When a customer runs OpenTelemetry collectors or Bindplane and asks how to keep credit card numbers and emails out
  of their observability data, cut log volume and cost before ingest, or send the same clean data to Dynatrace and
  an S3 archive, this demo shows it end to end on a realistic microservices shop. Card numbers and emails arrive
  hashed and CVVs masked, proxy access logs drop by about half, duplicate container logs disappear, and OTel host
  monitoring, collector health and feature-flag incidents are visible in Dynatrace, all without changing the
  application.
