setup_instructions: >
  1. One-time: install terraform, aws CLI (+ Session Manager plugin), bindplane CLI, python3 with PyYAML; create a
  Bindplane project (API key + collector secret key), a Dynatrace access token (openTelemetryTrace.ingest,
  metrics.ingest, logs.ingest) and install the OpenTelemetry Host Monitoring extension from Hub.
  2. cp lab.env.example lab.env and fill it in.
  3. ./lab.sh doctor, then ./lab.sh up (about 15 minutes).
  4. Before the demo: ./lab.sh pii on (optional synthetic PII logs), then ./lab.sh check; follow DEMO.md.
  ./lab.sh pii off afterwards.
  5. ./lab.sh down to remove the AWS resources (about USD 5 per day while running).
