apiVersion: bindplane.observiq.com/v1
kind: Processor
metadata:
  name: lab-sample-envoy-ok
spec:
  type: sampling
  parameters:
  - name: condition
    value:
      ottl: resource.attributes["service.name"] == "frontend-proxy" and IsMatch(body, "HTTP/[0-9.]+\" [0-9]+ ") and IsMatch(body, "HTTP/[0-9.]+\" [23][0-9]{2} ")
  - name: drop_ratio
    value: '0.90'
---
apiVersion: bindplane.observiq.com/v1
kind: Processor
metadata:
  name: lab-sample-kafka-logs
spec:
  type: sampling
  parameters:
  - name: condition
    value:
      ottl: (attributes["container.name"] == "kafka" or resource.attributes["k8s.container.name"] == "kafka") and not IsMatch(body, "\\b(WARN|ERROR|FATAL)\\b")
  - name: drop_ratio
    value: '0.90'
---
apiVersion: bindplane.observiq.com/v1
kind: Processor
metadata:
  name: lab-severity-from-message
spec:
  type: transform
  parameters:
  - name: telemetry_type
    value: Logs
  - name: logs_context
    value: log
  - name: error_mode
    value: ignore
  - name: statements
    value:
    - set(severity_number, SEVERITY_NUMBER_INFO)
    - set(severity_text, "INFO")
    - set(severity_number, SEVERITY_NUMBER_WARN) where IsMatch(body, "(\\bWARN(ING)?\\b|^warn:|\\twarn\\t|level=warn|^[0-9]+:[A-Z] [^#*]{10,45}# )")
    - set(severity_number, SEVERITY_NUMBER_ERROR) where IsMatch(body, "(\\b(ERROR|FATAL|SEVERE|PANIC|CRITICAL)\\b|^(fail|crit):|\\t(error|fatal|panic|dpanic)\\t|level=(error|fatal))")
    - set(severity_text, "WARN") where severity_number == SEVERITY_NUMBER_WARN
    - set(severity_text, "ERROR") where severity_number == SEVERITY_NUMBER_ERROR
  - name: conditions
    value: []
  - name: metrics_context
    value: datapoint
  - name: traces_context
    value: span
---
apiVersion: bindplane.observiq.com/v1
kind: Processor
metadata:
  name: lab-severity-journald
spec:
  type: transform
  parameters:
  - name: telemetry_type
    value: Logs
  - name: logs_context
    value: log
  - name: error_mode
    value: ignore
  - name: statements
    value:
    - set(severity_number, SEVERITY_NUMBER_INFO)
    - set(severity_text, "INFO")
    - set(severity_number, SEVERITY_NUMBER_WARN) where IsMap(body) and body["PRIORITY"] == "4"
    - set(severity_number, SEVERITY_NUMBER_ERROR) where IsMap(body) and IsMatch(body["PRIORITY"], "^[0-3]$")
    - set(severity_text, "WARN") where severity_number == SEVERITY_NUMBER_WARN
    - set(severity_text, "ERROR") where severity_number == SEVERITY_NUMBER_ERROR
  - name: conditions
    value: []
  - name: metrics_context
    value: datapoint
  - name: traces_context
    value: span
